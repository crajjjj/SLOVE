# ConsoleUtil Extended (CUE) command config for SLO VE's console diagnostics.
# Requires: ConsoleUtil Extended  https://www.nexusmods.com/skyrimspecialedition/mods/133569
# Drops into Data\SKSE\CustomConsole\ ; maps console subcommands onto the global
# functions in SLOVE_Test.psc. Output prints to the console (MiscUtil.PrintConsole).
#
# Usage:  SLOVE_Test DumpState        (alias)  slovetest dump
version: 1
name: SLOVE_Test
alias: slovetest
script: SLOVE_Test
help: SLO VE console diagnostics
subs:
  - name: DumpAnim
    alias: anim
    func: DumpAnim
    help: Dump the player's current scene - tags, per-actor labels, resolved slot, likely voice/SFX
  - name: DumpState
    alias: dump
    func: DumpState
    help: Print config flags, the player's resolved slot, and whether SLOVE.esp is loaded
  - name: AuditVoicePack
    alias: audit
    func: AuditVoicePack
    help: List which categories a slot resolves and which are MISSING
    args:
      - name: slot
        type: String
        required: true
        help: Slot id, e.g. F1
  - name: SampleCategory
    alias: sample
    func: SampleCategory
    help: Play one clip from an explicit slot/category at the player (handle=0 = nothing resolved)
    args:
      - name: slot
        type: String
        required: true
        help: Slot id, e.g. F1
      - name: category
        type: String
        required: true
        help: Category name, e.g. Orgasm
  - name: CaptionLine
    alias: capline
    func: CaptionLine
    help: Play the dedicated caption test line (Sound\fx\SLOVE\Test\01.wav) at the player - its subtitle should appear on screen
  - name: FolderLine
    alias: folderline
    func: FolderLine
    help: Shuffle-bag a file from Sound\fx\SLOVE\Test via PlayFolderWithLipSync - audible + mouth + caption = pass
  - name: FuzLine
    alias: fuz
    func: FuzLine
    help: Play the dedicated test .fuz (Sound\fx\SLOVE\Test) at the player - audible + duration>0 = fuz extraction works
  - name: TestCaption
    alias: caption
    func: TestCaption
    help: Play slot/category and report the picked wav + its caption sidecar text (write=1 = create a test sidecar and replay)
    args:
      - name: slot
        type: String
        required: true
        help: Slot id, e.g. F1
      - name: category
        type: String
        required: true
        help: Category name, e.g. Moan
      - name: write
        type: int
        default: 0
        help: 1 = if the wav has no sidecar, write a test one next to it and replay (file stays on disk)
  - name: FaceFix
    alias: facefix
    func: FaceFix
    help: Reset a stuck/deformed face - stops lipsync, strips tongue armors, resets MFG/MFEE (player + crosshair actor)
  - name: Milk
    alias: milk
    func: Milk
    help: Force a nipple squirt on the player to tune [milk] (needs Oninus Lactis NG + milk.enable=1)
    args:
      - name: intense
        type: int
        default: 0
        help: 1 = intense (milk.levelintense), 0 = non-intense (default)
  - name: Mute
    alias: mute
    func: Mute
    help: Send SLOVE_Mute_Stage / SLOVE_Mute_Scene for the crosshair actor (else the player) as another mod would - they go quiet until the stage changes / the scene ends
    args:
      - name: scope
        type: String
        required: true
        help: stage (until the stage changes) or scene (until the scene ends)
      - name: face
        type: int
        default: 0
        help: 1 = also hand over the face (expressions pause on that actor)
  - name: Unmute
    alias: unmute
    func: Unmute
    help: Send SLOVE_Unmute_Stage / SLOVE_Unmute_Scene for the crosshair actor (else the player)
    args:
      - name: scope
        type: String
        required: true
        help: stage or scene
  - name: Mutes
    alias: mutes
    func: Mutes
    help: List the actors with a mute written on them (SLOVE_Mute_* events) - level, caller, and whether it is in force
  - name: Willpower
    alias: willpower
    func: Willpower
    help: Set the stored willpower of the crosshair actor (else the player) to try a willpower display or the broken voice - this writes the real state
    args:
      - name: value
        type: int
        required: true
        help: 1-100 = that willpower (lifts a break), 0 = broken for the configured hours
