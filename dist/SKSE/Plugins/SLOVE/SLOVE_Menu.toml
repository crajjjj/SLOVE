# How the SLO VE in-game menu (SKSE Menu Framework) presents each SLOVE.toml key.
# Presentation only: this file holds no values and no defaults, and the menu
# works without it (every key then shows as a plain field under "Other").
#
# [[page]]     one per [section] of SLOVE.toml, in the order the pages appear.
# [[setting]]  one per key. Rows appear in this file's order, under "group".
#   control    flag (int 0/1 as a checkbox) | int | percent (int 0-100 slider)
#              | float | text
#   min, max   both given = a slider; otherwise a number field (still clamped)
#   step       step of a number field's + / - buttons
#   unit       shown after the label, e.g. "s"
#   requires   pplus | pplus219: the setting only does something on SexLab P+ /
#              P+ 2.19 or newer. The menu dims the row elsewhere, it never locks it.
#   tip        one line; never state the default here, the menu adds it.
# ASCII only (the menu font has no long dashes), and no "##" in a label.
# scripts\check-config.ps1 keeps this file, SLOVE.toml, the scripts and
# docs\config\slove.md in step: add a key to all of them together.

schema = 1

# ------------------------------------------------------------------ director

[[page]]
section = "director"
title = "Director"
note = "Master switches, intensity from physics, and NPC-only scenes."

[[setting]]
key = "director.enablevoice"
group = "Master switches"
label = "Scene voices"
control = "flag"
tip = "Master switch for all scene voices."

[[setting]]
key = "director.suppresssexlabvoice"
group = "Master switches"
label = "Silence SexLab's own moans"
control = "flag"
tip = "Silences SexLab's moan engine for everyone in a player scene so SLO VE is the only voice, and gives it back when the scene ends. Off lets SexLab moan alongside. Only acts while scene voices are on."

[[setting]]
key = "director.enableexpressions"
