# SLO VE — all settings. Read via TomlUtil (hosted by AudioUtil.dll).
# Live reload in-game:  SLOVE_Config Reload
# Voice SLOT mapping (which voice an actor gets) lives in the separate
# AudioUtil preset: SKSE\Plugins\AudioUtil\AudioUtil.toml.

[director]
enablevoice = 1                # master switch: scene voices
suppresssexlabvoice = 1        # 1 = silence SexLab's own moans in player scenes (AudioUtil owns the voice); 0 = let SexLab moan too. Only acts when enablevoice = 1.
enableexpressions = 1          # master switch: facial expressions
enablepcexpression = 1
enablemalenpcexpression = 1
enablefemalenpcexpression = 1
usephysicslabels = 1           # velocity-driven intense/soft (needs SLPP interactions)
physicsfastvelocity = 25.0     # abs velocity at/above which a stage reads as Fast
physicsslowfactor = 0.65       # hysteresis: drop back to Slow below fast*factor
soshugeppsize = 6              # SOS size / TNG size counted as "huge"
# NPC-only scenes (no player). When ON, SexLab scenes the player is NOT in - two NPCs
# nearby, a brothel, an orgy mod - also get SLO VE ambient voice (moans / breathing /
# reactions), facial expressions, body SFX and willpower/resistance. The PC dirty-talk
# voice engine, milk and on-screen notifications stay player-only. Adoption is bounded:
# only scenes within npcscenedistance of the player, up to maxnpcscenes at once. NPC
# scenes are voiced even while you are in a scene of your own (a follower starting a
# scene nearby is voiced too). Set enablenpcscenes = 0 for the pre-0.6.0 behavior
# (player scenes only). Per-actor behavior reuses the existing
# voiceallactors / enablemalenpcexpression / enablefemalenpcexpression / resistance NPC
# toggles - there are no separate NPC-scene sub-switches.
enablenpcscenes = 1            # 1 = process nearby NPC-only scenes; 0 = player scenes only
npcscenedistance = 2048.0      # max distance (game units, ~hearing range) from the player to adopt an NPC scene
maxnpcscenes = 3               # cap on concurrent NPC scenes processed (protects the Papyrus VM in busy areas)
printdebug = 0

[resistance]
# Willpower -> break system (ported from Hentairim). Each actor starts at 100
# willpower; being penetrated drains it by the RISE in SexLab enjoyment x the
# multipliers below. At 0 the actor "breaks" (broken voice lines + broken/ahegao
# face for the rest of the break). Broken points = game-hours of no-sex needed to
# recover; willpower otherwise regenerates over hours between scenes.
# Penetration is measured by the PPA bridge (AudioUtil) when present, falling
# back to SexLab p+ position labels.
enable = 1                     # master switch for the whole system
enablepc = 1                   # PC loses willpower
enablemalenpc = 1              # male NPCs lose willpower
enablefemalenpc = 1            # female NPCs lose willpower
enablecreaturenpc = 1          # creatures lose willpower
enablebrokenstatus = 1         # play broken voice lines while broken (0 = broken face only)
pcmaxresistance = 1000         # PC drain denominator - HIGHER = slower drain (NPCs use the race table)
# damage multipliers (percent of the base drain)
pcnonvictimmult = 20           # PC, willing
npcnonvictimmult = 30          # NPC, willing
pcvictimmult = 110             # PC, victim/submissive (drains faster)
npcvictimmult = 130            # NPC, victim/submissive
hugeppmult = 200               # extra multiplier when the PC's partner is huge
# recovery (percent of willpower regained per game-hour of no sex) + break severity
pcrecoverperhour = 10
npcrecoverperhour = 5
pcbrokenpoints = 60            # hours-to-recover set when the PC breaks
npcbrokenpoints = 40           # hours-to-recover set when an NPC breaks
victiminsertiontrauma = 5      # extra willpower hit when a submissive is forcibly entered (0 = off)
pcnotifyinterval = 25          # PC-only: "resolve weakens" notification each time willpower DRAINS down through this % band (e.g. 75/50/25). Draining only - recovery is handled by scenestartnotification. 0 = off
scenestartnotification = 1     # PC-only: at scene start, announce break status - "recovered your composure" when a break clears, or "still broken (N hours to recover)" while it persists. 0 = off

[voice]
# chances are percent (0-100)
enablehugeppscenario = 1
enablevictimscenario = 1
chancetocommentunamused = 15
chancetocommentonleadinstage = 8
chancetocommentonnonintensestage = 22
chancetocommentonintensestage = 25
chancetocommentononattackingstage = 22
chancetocommentonblowjobstage = 15
chancetocommentwhenclosetoorgasm = 45
chancetocommentwhenmaleclosetoorgasm = 40
femaleorgasmhypeenjoyment = 75 # enjoyment threshold for orgasm hype lines
maleorgasmhypeenjoyment = 75
intenseenjoyment = 50          # PC enjoyment at/above which voices go intense (mirrors SLSO sl_hot_voice_strength); 0 = off. Both P+ and classic. With intense_from_bar_only=1 (default) this bar ALONE decides intense voices, so keep it reachable within a scene.
intense_from_bar_only = 1      # 1 = SLSO-style (default): the enjoyment bar ALONE decides intense voices, so NearOrgasmNoises plays only at/above intenseenjoyment and for no other reason. 0 = also go intense on authored fast/intense animation tags (pre-0.6.3 behavior; useful if your enjoyment bar never climbs, e.g. no SLSO meter). Both P+ and classic. Voice only - facial expressions stay tag-driven.
enablemalevoice = 1            # MASTER male switch: 0 disables ALL male audio (both dirty-talk and moaning)
chanceformaletocomment = 30
voiceallactors = 1             # secondary partners speak (male rotation + female NPCs); 0 = PC + lead male only
creaturebreathing = 1          # creature partners (C-slots) pant/growl during the scene
creaturebreathmininterval = 3  # seconds between creature breaths (halved on intense stages)
creaturebreathmaxinterval = 8
malemoaning = 1                # ambient male-partner moans (male mirror of creaturebreathing); needs enablemalevoice = 1
malemoanmininterval = 5        # seconds between male moans (halved on intense stages)
malemoanmaxinterval = 12
moanonly = 0                   # 1 = moans only, no spoken lines (males then moan via malemoaning above)
hypebeforeorgasm = 0           # DEPRECATED & ignored - froze SLSO's orgasm at 100%. Leave at 0.
useblowjobsoundforkissing = 1
pcvolume = 100                 # 0-100; the PLAYER's own voice
partnervolume = 100            # 0-100; partners in the PLAYER's scene
orgasmvolume = 100             # 0-100; PC climax/orgasm cries ONLY (own volume bus, independent of pcvolume)
# 0-100; NPC-only scenes (no player) get their OWN voice bus, so you can make nearby
# NPC scenes quieter than your own without touching partnervolume. Covers their
# moans/breathing/reactions AND their orgasm cries. Default = partnervolume (so it
# matches the old behavior until you change it). Distance falloff (AudioUtil
# voice_attenuation) still applies on top.
npcscenevolume = 100
# Variation A/B is a per-pack property: set variation = "B" on the pack's
# [[slot]] in its AudioUtil config (see SLOVE_zpack_*.toml).
enableddgagvoice = 1           # gagged voice when Devious Devices gag worn
printdebug = 0

[expressions]
enablebreathing = 1
breathingupdateinseconds = 0.55
pcnonintenseexpressionupdateinseconds = 2.1
pcintenseexpressionupdateinseconds = 1.6
npcnonintenseexpressionupdateinseconds = 2.1
npcintenseexpressionupdateinseconds = 1.6
enabletongue = 1              # P+ ONLY. The contact tongue (shown during cunnilingus/blowjob)
                              # needs SexLab P+'s oral-contact detection; the classic variant
                              # has none, so it never shows a contact tongue regardless of this
                              # setting (ahegao and its tongue-out are unaffected).
tonguetype = 1                 # HALO HDT tongue model 1-10; 0 = random
removetongueonblowjob = 1
cunusetongue = 1
enableahegao = 1               # huge partners trigger ahegao while penetrating
# When another mod is driving an actor's ahegao face, SLO VE yields so the two
# don't fight (that actor's expression writes pause - tongue dropped, mouth
# handed back - resuming when the signal clears). It watches THREE signals:
#   1. built-in: SexLab Survival's _SLS_AhegaoStateChange event (always on, no config)
#   2. ahegaoitems       - worn item forms (below)
#   3. ahegaostoragekeys - StorageUtil keys (below)
# The two lists are additive extra triggers; leave a list empty to skip it.
#
# ahegaoitems: while any listed item is equipped on an actor, it counts as an
# external ahegao. Comma-separated 'Plugin.esp|FormID' (hex local id, 0x optional;
# plugin names may contain spaces), up to 16. e.g. "SomeAhegao.esp|000800, Other.esp|1A4F"
ahegaoitems = ""
# ahegaostoragekeys: same yield, keyed on a StorageUtil int instead of a worn
# item - while any listed key reads > 0 on an actor, it counts as an external
# ahegao. The robust way to detect a mod whose many tongue/face variants all set
# one key. Default catches the Artsick "Ahegao" mod (AhegaoTongues.esp), which
# sets "TongueOn" per actor while its tongue is equipped. Comma-separated key
# names, up to 16; harmless (reads 0) when the mod isn't installed.
ahegaostoragekeys = "TongueOn"
chancetostickouttongueduringintense = 30
chancetostickouttongueduringattacking = 30
tonguemouthopenthreshold = 0.4 # jaw gate: min measured mouth-open for tongue
tongueretractgraceseconds = 2.0 # grace before retracting when the tongue's trigger briefly drops (oral proximity flickers as the head moves); raise to hold the tongue through longer gaps, 0 = retract instantly
printdebug = 0

[sfx]
# Body-SFX engine (SLOVE_SFX): slushing / impact / clap / kissing / blowjob
# sounds, played through AudioUtil (the sound names map to folders in the
# AudioUtil preset's [sfx] table; audio ships under Sound\fx\SloveSFX).
# Defaults track this load order's patched HentairimSFX/Config.json, not base
# Hentairim: the adaptive-velocity keys (useadaptivevelocity, timestosearch)
# are patch additions and are not in the shipped Hentairim SFX config.
enable = 1                     # master switch (applies the SFX effect to scene actors)
volume = 60                    # 0-100, startup value for the "sfx" audio group
usevelocity = 1                # thrust-synced sounds from SLPP collision velocity
# SOSBend calibration search: spams Debug.SendAnimationEvent(SOSBend) with 0.3s
# waits to hunt for a bend that yields velocity data. Heaviest path in the
# engine and off by default - only turn on if a scene otherwise reports no
# velocity (needs both keys: useadaptivevelocity=1 AND timestosearch>0).
useadaptivevelocity = 0        # SOSBend calibration search when no velocity data
timestosearch = 0              # adaptive: max calibration attempts per stage (0 = never search)
usecontactsfx = 1              # one-shots on contact edges (insertion, pull-out gape, kiss, oral)
usecontactvictimreactions = 1  # suppress tender kiss cues when a victim is involved
# poll intervals (seconds). velocitypoll must stay tight to catch thrust
# reversals; normalpoll paces the label/tag-driven loop (raise it to cut
# script load further - the sound's own clip length already paces playback).
velocitypoll = 0.1
normalpoll = 0.5
# measured-gape thresholds (PPA bridge): openings are unitless magic numbers,
# 0.0 = closed; calibrate against the pull-out printdebug line in your scenes
gapevaginalaverage = 2.0
gapevaginalhuge = 2.7
gapeanalaverage = 2.8
gapeanalhuge = 4.0
printdebug = 0

