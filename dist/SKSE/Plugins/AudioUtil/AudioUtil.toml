# AudioUtil BASE config — SLO VE preset (globals only).
#
# SLO VE ships this file to overwrite AudioUtil's neutral default via load order.
# Engine-wide globals — [general]/[ppa]/[lipsync] and the [gag] enable/
# default_category toggles — are read ONLY from this base, never from a
# config\*.toml overlay (an overlay that sets them is ignored + warned). All the
# voice CONTENT — the slots, the actor->slot routing maps, the category maps and
# SFX — lives in the additive overlay
#   SKSE\Plugins\AudioUtil\config\SLOVE_voices.toml
# and any mod may drop its own config\*.toml to ADD slots / sfx / mappings (they
# accumulate). Re-read both in-game with  au reload.
# All key/name matching is case- and space-insensitive.
#
# How an actor resolves to a slot, how a category resolves to audio, and every
# key below are documented in full at: https://crajjjj.github.io/AudioUtil/

[general]
log_level = "info"            # trace | debug | info | warn | error
sound_flags = 0x1A            # BuildSoundDataFromFile flags (experiment via DebugPlayFile)
sound_priority = 128
# false = voices play flat/2D at full volume so every speaker is equally audible;
# true = 3D at the speaker (partners/creatures attenuate with distance). Lipsync
# unaffected either way; SFX always play 3D at the actor.
voice_3d = true
# skip a new voice line while the speaker's channel is still playing one, so a
# line finishes first (per speaker; different speakers still overlap).
voice_no_interrupt = true
# Distance attenuation for follow-positioned sounds (voice + SFX). Loose-file
# playback has no sound-descriptor rolloff curve, so voice_3d positions a sound but
# barely makes it quieter with distance - fine when everything plays next to the
# player, but a scene far away (SLO VE NPC-only scenes) would blast at full volume.
# When on (needs AudioUtil 0.9.11+ for the live curve), each sound's volume is scaled
# by the player->speaker distance: full within attenuation_near, then an
# inverse-distance rolloff (-6 dB per doubling, like the engine's own voice curves)
# down to attenuation_floor at attenuation_far (game units, ~70/m). Re-sampled every
# 250 ms while a line plays, so walking toward/away from a scene tracks. Near sounds
# (your own scene) are unaffected (~full). Purely a volume scale on top of voice_3d's
# positioning.
voice_attenuation = true      # false = old behavior (no distance volume falloff)
attenuation_near = 200.0      # full volume within this distance (~3 m)
attenuation_far = 1800.0      # volume reaches the floor at/beyond this distance (~26 m)
attenuation_floor = 0.05      # minimum volume factor for far sounds (0.0 = silent)
# In-session fuz playback. Skyrim loads loose files only at launch, so a fuz decoded
# on first play (cache wav written mid-session) would be silent until a restart
# (worse under MO2). AudioUtil routes the audio through one of N pre-indexed
# placeholder wavs so it plays immediately, freed when the line ends. N = max fuz
# lines sounding at once; 24 covers overlapping PC + NPC voices. 0 disables the pool.
fuz_slots = 24
# Background decode-ahead at game start (worker thread): first play already works via
# fuz_slots - this only removes the brief inline-decode hitch on a line's very first
# play by decoding the slot fuz ahead of time. Cheap once cached. (Ad-hoc folders
# outside the configured slots aren't prewarmed - use `autest warmfolder <dir>`.)
prewarm_fuz = true
default_female_slot = "F0"    # unrouted female NPCs speak the stock moans
default_male_slot = "M1"
# reserved player slots: the PC always speaks this slot and no NPC ever resolves
# to it. Set pc_male_slot = "M1" too when playing a male PC.
pc_female_slot = "F1"
pc_male_slot = "M1"

[ppa]
enable = true                 # Accurate Penetration bridge: drives thrust-synced SFX + contact one-shots
event_rate_ms = 2000          # min interval per receiver for AudioUtilPPA_Update events (floored at 1000)

[lipsync]
# Mouths move with the moans: every PlayVoice line drives the speaker's MFG
# phonemes. Lines that ship lip data (a same-stem .lip, or a .fuz's embedded
# lip block) play the authored per-phoneme curves; everything else is driven
# from the wav's loudness envelope. Loose PCM wavs only; BSA-packed creature
# slots play fine without mouth movement.
enable = true
gain = 1.0                    # 0.0-2.0 mouth-open strength
attack_ms = 30                # opening speed toward a louder level
release_ms = 90               # closing speed on quiet / clip end
min_level = 0.04              # levels below this keep the mouth closed
block_in_dialogue = true      # in a dialogue with the player the game drives the mouth - stay off it
use_lip_files = false         # EXPERIMENTAL - authored .lip/fuz phoneme curves when a line has them,
                              # instead of the amplitude envelope. Off = the tested envelope/pseudo path.
                              # Console A/B toggle: autest lipfiles on|off
drive_modifiers = false       # keep .lip blink/brow/gaze channels OFF - SLO VE expressions own those
                              # (only relevant while use_lip_files is on)
# Lines WITHOUT lip data (all current SLO VE voicepacks): synthesize phoneme
# curves from the envelope - per-syllable vowel variety (Aah\Oh\Ooh\Eh) plus
# brief lip closures between moans - instead of the plain Aah jaw-flap.
# Deterministic per file. Console A\B toggle: autest pseudolip on|off
pseudo_phonemes = true
lead_ms = 0                   # mouth timing lead in ms (-300..300): raise if the mouth visibly
                              # trails the sound. Calibrate live with `autest liplead 80` etc.,
                              # then persist the winning value here.
# Pseudo-synthesis tuning: calibrate in AudioUtil's tools\lipsim (drop a SLO VE
# voicepack wav, drag sliders, "copy constants"), paste here, `au reload`.
pseudo_voiced_floor = 0.05    # voiced when envelope >= max(min_level, this)
pseudo_valley_ratio = 0.6     # syllable split depth (higher = choppier)
pseudo_min_syl_frames = 3     # min syllable length (30 fps frames)
pseudo_gap_frames = 5         # silence frames earning a lip closure (5 = 165 ms)
pseudo_closure = 0.85         # closure strength 0-1
# categories that never drive the mouth: blowjob action / licking / rimjob are oral
# SFX (slurping, not vocalization - and the licking mouth is busy); Orgasm hands the
# mouth to the climax/ahegao face; PullOutGape is a wet gape squelch (played on
# the voice path, so block it here). LickingComments/RimjobComments are deliberately
# NOT blocked - those are spoken lines between licks, and spoken lines lipsync.
block_categories = ["BlowjobActionSoft", "BlowjobActionIntense", "BlowjobAction", "Licking", "LickingIntense", "LickingForced", "Rimjob", "RimjobIntense", "RimjobForced", "Orgasm", "PullOutGape"]

[gag]
# When a speaking female wears a keyword below, her voice routes through her
# slot's gag_slot (F1/F2/F3 -> F1gag in SLOVE_voices.toml) for a muffled clip and
# lipsync is suppressed (the device owns the mouth). F1gag holds only "GagMoan",
# so every gagged line falls through to default_category - muffled, never
# silence, never a clear line. Keywords are 'Plugin.esp|FormID'; one whose mod
# isn't installed is silently skipped, so listing them all is harmless.
enable = true
default_category = "GagMoan"
keywords = [
  'Devious Devices - Assets.esm|7EB8',   # zad_DeviousGag
  'ZaZAnimationPack.esm|8A4D',           # zbfWornGag
  'ZaZAnimationPack.esm|8A35',           # zbfEffectOpenMouth
  'Toys.esm|8C2',                        # ToysEffectMouthOpen
]

[tongue]
# Worn-tongue lipsync suppression. A visible tongue armor holds the mouth open;
# the lipsync jaw-flap clips it (the mouth-opens-and-closes-during-cunnilingus
# artifact). When a speaking actor wears any marker below, AudioUtil keeps lipsync
# off that actor's mouth - both new lines and, within the 500 ms re-check, an
# in-flight one. Detection only (no voice rerouting - no [tongue] gag_slot analogue).
#
# SLO VE's own script side already blocks lipsync while its tongue is out (via
# ApplyFaceMouthOwnership/blockLipSync); this keyword makes the DLL authoritative
# and closes the jaw-gate equip/unequip churn window on the armor path. The MFEE
# MORPH tongue is NOT an armor and carries no keyword - SLO VE's script side
# remains the only thing covering that path, so it must stay.
#
# SLOVE_TongueKeyword (SLOVE.esp|081F) is carried by all ten tongue armors
# (SLOVE_Tongue1Armor..10Armor), so one line covers the whole family and any
# future variant given the keyword. enable is base-only; keywords is additive.
enable = true
keywords = [
  'SLOVE.esp|081F',          # SLOVE_TongueKeyword (on all SLOVE_Tongue*Armor)
  'SL Survival.esp|0B74B5',  # _SLS_TongueKeyword (SLS tongue/deepthroat device)
]
