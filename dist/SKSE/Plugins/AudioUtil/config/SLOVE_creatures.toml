# AudioUtil overlay - SLO VE: every CREATURE voice slot (additive content).
#
# One of SLO VE's four AudioUtil overlays (see the file map at the top of
# SLOVE_female.toml). This file owns the whole creature side: slots C0-C41 and
# the [race_map] hints that route actors to them.
#
# C1-C41 are reached by the race hints below; C0 is the catch-all every other
# creature lands on (default_creature_slot in the base AudioUtil.toml). Race
# hints are substring-matched against the race editor id, longest hint first,
# and accumulate across every overlay, so a patch can add species without
# touching this file.
#
# Every slot is an explicit file list of vanilla (or More Nasty Critters) sound
# files, because folder SCANS cannot see BSA-packed audio - only an explicit
# list resolves through the engine's resource loader. Paths are verified against
# the SE archive listing; vanilla ships no Sound\FX material at all for some
# creatures (Falmer and Spriggan combat barks live in the voice archives, not
# fx), which is why some lists are thin.
#
# Two categories per slot: Orgasm fires at climax, Breathing is rolled
# periodically by SLOVE_Voice during the scene (see SLOVE.toml [voice]
# creaturebreathing*). Every slot ships both. A slot without Breathing is silent
# between climaxes: there is deliberately no Breathing -> Orgasm fallback (it
# used to be in SLOVE_voices.toml, and since the male category tables are shared
# with the human male packs it also turned a werewolf routed to a male pack into
# a climax cry on every breath). Keep Breathing clips short, about 2 s: a creature
# in an NPC-only scene climaxes on the same channel it breathes on, and AudioUtil
# skips a line while that channel is still playing.
#
# DEPENDENCY: the fox (C19) and dragon (C28) slots are sourced ENTIRELY from
# More Nasty Critters, and the lurker (C23) and hagraven (C27) slots mostly so.
# Without MNC installed those slots play nothing: AudioUtil trusts an explicit
# list as written (its load-time audit logs each missing file), so a missing file
# never reaches the fallback = "C0" those slots carry. That fallback only covers
# a category a slot does not list at all.

[race_map]
# ---- C0-C10 (base species) ----
Werewolf = "C1"
Draugr = "C2"            # skeletons are NOT covered - add a Skeleton hint if wanted
Falmer = "C3"
Troll = "C4"
Giant = "C5"
Wolf = "C6"
Dog = "C7"
Husky = "C7"             # DLC1HuskyRace / armored huskies don't contain "Dog"
Chaurus = "C8"           # includes Reaper and Hunter variants
Spriggan = "C9"          # includes Matron
Horse = "C10"
# ---- C11-C41 (extended species) ----
DLC1DeathHoundRace = "C6"
DLC2RieklingRace = "C11"
SkeletonArmorRace = "C12"
SkeletonRace = "C12"
FrostbiteSpiderRace = "C13"
FrostbiteSpiderRaceGiant = "C13"
SkeeverRace = "C14"
HorkerRace = "C15"
BearBlackRace = "C16"
BearSnowRace = "C16"
'Cave Bear' = "C16"
'Snow Bear' = "C16"
DLC2WerebearBeastRace = "C16"  # a transformed werebear; AudioUtil 0.9.32+ tries this before his human voicetype
SabreCatRace = "C17"
DLC2BoarRace = "C18"
DLC2MountedRieklingRace = "C41"
FoxRace = "C19"
DeerRace = "C20"
