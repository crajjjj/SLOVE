[[slot]]  # GENERIC creature catch-all - default_creature_slot in AudioUtil.toml.
          # Reached by any creature (no ActorTypeNPC keyword) that NO [race_map] hint
          # covers: spiders, foxes, skeevers, mudcrabs, bears, sabrecats, modded
          # beasts. Without it those fall out of the chain entirely and stay silent
          # (they must never reach default_male_slot - everything there is a human
          # voice pack, which is how an unmapped frostbite spider ended up speaking
          # M2's Argonian lines). Deliberately species-NEUTRAL: low bear/sabrecat/troll
          # breaths and growls that read as "some large animal" rather than as any one
          # creature, since this pool plays for all of them. A creature that deserves
          # its own voice gets a [race_map] hint + its own C-slot instead, which always
