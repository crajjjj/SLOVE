# female voicetypes -> the NPC VOICE POOL (F2-F10). Every listed voicetype
# SPREADS its NPCs across the nine pool ids, deterministically keyed on the
# NPC's base form (same NPC = same slot, so a given bandit is always the same
# voice; different NPCs distribute). All nine are always live: SLOVE_female.toml
# declares each as a stub over one of SexLab's stock female voices, so a
# pack-less install already spreads NPCs over seven distinct voices, and an
# installed voicepack replaces the id it claims (slots are keyed by id, the
# last file in sorted filename order wins). F1 is PC-reserved and can never
# appear here. Pin one specific follower to a pool slot via [npc_overrides] to
# override the spread. Unique-voiced NPCs (their own voicetype, not listed
# below) aren't pooled - pin them if you want them voiced.
