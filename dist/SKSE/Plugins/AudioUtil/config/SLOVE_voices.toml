# --- A-name -> B-folder bridges (same beat, different spelling) ---
# PlaySound's per-actor VarB remap only fires when a call site's debugtext
# DIFFERS from the category name - the debugtext IS the B folder name. A handful
# of beats pass the A name as their own debugtext (nothing to remap to), yet the
# B layout spells that beat differently: "Penetrative..." vs the on-disk
# "Penetrated...", and the cum-request pools, whose B folders spell out the whole
# beat. Those requests reached AudioUtil under a name no folder, alias or
# fallback matched, so they fell past the pack to the F0/F0B stock moans with the
# pack's own populated folder sitting unused - "SLOVE asked for
# PenetrativeCommentsIntense and I heard a SexLab moan". Reported from a full
# scene log: three of these (PenetrativeCommentsIntense/-Soft, AskForVaginalCum)
# never reached a pack at all.
