# FALLBACKS rather than [category_aliases.female] on purpose: an alias is one hop
# and dead-ends, a fallback keeps walking the ladder below. So a tag-shaped (vD)
# pack that ships only "Penetrated Comments" and expresses intensity as a TAG
# still lands in-pack (-> "Penetrated Comments Intense" -> "Penetrated Comments"),
# which an alias would not have done. Inert everywhere the literal name exists:
# F0/F0B and the A packs list it, and the literal is always tried first.
