# ---------- voice slots ----------
# Female voices work OUT OF THE BOX and with Hentairim/IVDT packs:
#   F0  = the stock DEFAULT female voice: SexLab's own moan set (loose files
#         every SexLab P+ install already has - nothing bundled, plain PCM so
#         lipsync works), mapped per category by intensity. All females speak
#         this until a pack or a pin says otherwise. (F0B = second stock
#         voice, used as the backfill for the partner/follower slots.)
#   F1  = the PLAYER pack slot (reserved in the base AudioUtil.toml): scans
#         Sound\fx\SLOVE\F1 - drop ANY Hentairim-convention female pack there
#         and it just plays, no config edits. Categories the pack lacks (or the
#         whole slot, when no pack is installed) backfill per-category from F0
#         via `fallback`.
#   F2-F10 = the NPC VOICE POOL: female NPCs in scenes spread across whatever
#         pool slots are filled (via the female [voicetype_map] entries above).
#         These slots are NOT pre-declared here - each NPC voice pack ships its
#         own [[slot]] (id = F2..F10) in a config\*.toml overlay, so the pool
#         auto-sizes to the packs installed (AudioUtil drops undeclared ids from
#         the spread, so empty slots never dilute it). A pool pack sets
#         fallback = "F0B" and gag_slot = "F1gag" (template at the F2-F10 slot
#         comment below).
# Categories a stock slot doesn't list resolve via [category_aliases.female]
# / [category_fallbacks.female] (both in the base AudioUtil.toml). Audit any
# slot in-game: SLOVE_Test AuditVoicePack F1.
# M1-M8 are the bundled male packs (Hentairim voice pack assets, shipped
# with SLO VE under Sound\fx\SLOVE):
# M1 Even Toned, M2 Argonian, M3 Brute, M4 Nord, M5 Condescending,
# M6 Dark Elf, M7 Khajiit, M8 Orc. Creature slots C1-C10 are defined at the
# bottom of the file (explicit BSA file lists, no folders).

[[slot]]  # player pack slot - any female pack dropped here wins per category
id = "F1"
sex = "female"
path = 'Sound\fx\SLOVE\F1'
fallback = "F0"
gag_slot = "F1gag"    # muffled DD-gag voice when the actor wears a gag (see [gag])

# ---- NPC voice-pool slots (F2-F10) are PACK-PROVIDED, not declared here ----
# Each NPC voice pack drops a config\*.toml overlay defining its own slot; the
# female [voicetype_map] spread above then routes scene female NPCs to it. Only
# declared ids join the pool, so it's exactly the set of installed packs.
# Template a pack overlay copies (one [[slot]] per pack, any free id F2..F10):
#   [[slot]]
#   id = "F2"                        # any free pool id F2..F10
#   sex = "female"
#   path = 'Sound\fx\SLOVE\<Pack>'   # the pack's own unique audio folder
#   fallback = "F0B"                 # backfill missing categories with stock moans
#   gag_slot = "F1gag"               # shared muffled gag pool
#   # variation = "B"                # only if the pack uses the partitioned layout

[[slot]]  # gagged-female voice. Gagged speakers route here via gag_slot. F1gag has
          # NO fallback and only a GagMoan\ folder, so every requested category
          # misses here and the [gag] default_category "GagMoan" (AudioUtil.toml)
          # takes over - playing the muffled gag moans below (~27 atm_*/flat_* clips)
          # for EVERY gagged line, regardless of pack or variation. Never F0's clear
          # stock moans, never the pack's spoken line. Do NOT add fallback = "F0"
          # here: F0 lists nearly every category, so the requested category would
          # resolve to a clear stock moan and GagMoan would never play. (To override
          # a single beat, drop a pack-specific muffled clip in as a named category
          # folder here.)
id = "F1gag"
sex = "female"
path = 'Sound\fx\SLOVE\F1gag'

