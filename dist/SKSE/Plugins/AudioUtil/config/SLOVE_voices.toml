# female voicetypes -> the NPC VOICE POOL (F2-F10). Every listed voicetype
# SPREADS its NPCs across whatever pool slots are actually filled: AudioUtil
# drops undefined ids from the list, so the pool auto-sizes to the packs you
# installed. 0 pool packs -> every id drops out -> females fall to
# default_female_slot (F0 stock moans). 1 pack -> all female NPCs use it. 2+ ->
# deterministic spread, keyed on the NPC's base form (same NPC = same pack, so a
# given bandit is always the same voice; different NPCs distribute). F1 is
# PC-reserved and can never appear here. Pin one specific follower to a pool slot
